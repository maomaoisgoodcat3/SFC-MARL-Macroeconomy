# scenarios/em_baseline.yaml
# ==============================================================================
# Kich ban "Emerging Market Baseline" -- chi doi lai suat khoi tao ve gan
# trung vi cac nen kinh te dang phat trien (Vietnam/Thailand/Malaysia/Brazil-
# type), cac tham so con lai giu nguyen mac dinh (xem scenarios/default.yaml
# de biet day du chu thich tung tham so).
#
# Nguon lai suat khoi tao:
#   - initial_lending_rate = 0.12 (12%/nam): trung vi lai suat cho vay
#     emerging market, IMF Financial Access Survey 2023.
#   - initial_deposit_rate = 0.05 (5%/nam): trung vi lai suat tien gui
#     emerging market, World Bank Global Financial Development Database 2023.
# LUU Y: day chi la GIA TRI KHOI TAO (Bank van tu do hoc dieu chinh lai suat
# qua RL trong pham vi action space [1%-25%] lending / [0.5%-15%] deposit da
# co san o rllib_wrapper.py -- khong doi bien do action space).
# ==============================================================================

num_employees: 50
num_firms: 5
num_banks: 1
max_steps: 240

inheritance_fraction: 0.15
min_newborn_cash: 500.0
min_reproduction_age: 22
max_reproduction_age: 45
min_reproduction_wealth_mult: 3.0
trait_mutation_sigma: 0.05
hard_min_emp: 30
hard_max_emp: 200

initial_lending_rate: 0.12   # IMF Financial Access Survey 2023
initial_deposit_rate: 0.05   # World Bank Global Financial Development Database 2023

gini_penalty_coef: 25.0
death_penalty_coef: 20.0
npl_flow_penalty_coef: 0.06
npl_stock_penalty_coef: 50.0
npl_writeoff_months: 6
emp_death_penalty_base: 100.0
emp_death_penalty_horizon_multiplier: 1.0
reward_scale_employee: 0.045
reward_scale_firm: 0.018
reward_scale_government: 0.04
reward_scale_bank: 0.04
reward_scale_supervisor: 0.012
reward_scale_economy: 0.02
reward_clip: 100.0
subsistence_indexation_ceiling_mult: 3.0
